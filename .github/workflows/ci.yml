name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go: test + lint + vuln scan ───────────────────────────────────────────
  go-test:
    name: Go — Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test ./... -race -count=1 -timeout 120s

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  # ── Worker: typecheck + vitest ────────────────────────────────────────────
  worker-test:
    name: Worker — Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Typecheck
        run: npm run typecheck
        working-directory: worker

      - name: Test
        run: npm test
        working-directory: worker

  # ── Docker build verification (Go services) ───────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4

      - name: Build platform image
        run: docker build -f services/platform/Dockerfile -t wimse-demo-platform:ci .

      - name: Build workload image
        run: docker build -f services/workload/Dockerfile -t wimse-demo-workload:ci .

      - name: Build apis image
        run: docker build -f services/apis/Dockerfile -t wimse-demo-apis:ci .

  # ── SBOM + container vulnerability scan ──────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary for SBOM
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/platform ./services/platform/cmd/

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json

      - name: Vulnerability scan (Grype)
        uses: anchore/scan-action@v4
        with:
          sbom: sbom.spdx.json
          fail-build: false
          severity-cutoff: high

  # ── Deploy Worker to Cloudflare (main only) ───────────────────────────────
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: worker-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Deploy Worker
        run: npx wrangler deploy --env production
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # SPA is deployed automatically by Cloudflare Pages GitHub integration on push to main.
  # No CI job needed — removing avoids racing with Cloudflare's own pipeline.
