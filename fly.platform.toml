# Fly.io app: wimse-demo-platform
# Runs SPIRE simulator (8081) + Authorization Server (8082) on a single VM.
# Free tier: 256MB RAM, shared CPU. Two HTTP servers in one process.
#
# NOTE: Free tier allows 3 VMs total across all apps. This project uses:
#   - wimse-demo-platform  (this file)
#   - wimse-demo-workload
#   - wimse-demo-apis
# If you need to scale beyond the free tier, split services into individual apps.

app = "wimse-demo-platform"
primary_region = "sjc"

[build]
  dockerfile = "services/platform/Dockerfile"

[http_service]
  internal_port = 8081
  force_https   = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  ADDR = ":8081"
