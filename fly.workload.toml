# Fly.io app: wimse-demo-workload
# Runs the transaction-processor on 8083.
# Depends on platform (SPIRE + AS) and apis (fraud + compliance) being deployed first.

app = "wimse-demo-workload"
primary_region = "sjc"

[build]
  dockerfile = "services/workload/Dockerfile"

[http_service]
  internal_port = 8083
  force_https   = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  ADDR               = ":8083"
  SPIRE_URL          = "https://wimse-demo-platform.fly.dev"
  AS_URL             = "https://wimse-demo-platform.fly.dev"
  FRAUD_API_URL      = "https://wimse-demo-apis.fly.dev"
  COMPLIANCE_API_URL = "https://wimse-demo-apis.fly.dev"
  # SPIRE and AS are on the same host/port after single-port consolidation.
  # FRAUD and COMPLIANCE are on the same host/port after single-port consolidation.
