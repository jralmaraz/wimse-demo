<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIMSE B2B Demo</title>
<style>
/* ── JetBrains Mono subset (latin, regular + bold) ────────────────────────── */
@font-face {
  font-family: 'JBMono';
  font-weight: 400;
  font-style: normal;
  font-display: swap;
  src: url('data:font/woff2;base64,d09GMgABAAAAAAYUAA4AAAAAD4QAAAXCAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGhYbHBwcBmAAgRQRCAqMCIsHATYCJAMgBCAFgwAHIBvvDIuimgIREREREREUERERERERERERERERERERERER') format('woff2');
}
/* fallback — system mono shown if above subset doesn't load (it's a placeholder) */

/* ── Tokens ───────────────────────────────────────────────────────────────── */
:root {
  --bg:          #070C18;
  --surface:     #111827;
  --surface2:    #1C2637;
  --border:      #1E2D40;
  --accent:      #38BDF8;
  --accent-dim:  #0C4A6E;
  --ok:          #22C55E;
  --ok-dim:      #052E16;
  --reject:      #EF4444;
  --reject-dim:  #3F0D0D;
  --rogue:       #F97316;
  --rogue-dim:   #431407;
  --muted:       #64748B;
  --text:        #E2E8F0;
  --text-faint:  #94A3B8;
  --mono:        'JBMono', ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace;
  --sans:        system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:           6px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:         #F1F5F9;
    --surface:    #FFFFFF;
    --surface2:   #F8FAFC;
    --border:     #CBD5E1;
    --accent:     #0369A1;
    --accent-dim: #DBEAFE;
    --ok:         #16A34A;
    --ok-dim:     #DCFCE7;
    --reject:     #DC2626;
    --reject-dim: #FEE2E2;
    --rogue:      #EA580C;
    --rogue-dim:  #FFEDD5;
    --muted:      #94A3B8;
    --text:       #0F172A;
    --text-faint: #64748B;
  }
}
:root[data-theme="light"] {
  --bg:         #F1F5F9;
  --surface:    #FFFFFF;
  --surface2:   #F8FAFC;
  --border:     #CBD5E1;
  --accent:     #0369A1;
  --accent-dim: #DBEAFE;
  --ok:         #16A34A;
  --ok-dim:     #DCFCE7;
  --reject:     #DC2626;
  --reject-dim: #FEE2E2;
  --rogue:      #EA580C;
  --rogue-dim:  #FFEDD5;
  --muted:      #94A3B8;
  --text:       #0F172A;
  --text-faint: #64748B;
}

/* ── Reset + Base ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}
button { cursor: pointer; font: inherit; }
a { color: var(--accent); }
code, pre, .mono { font-family: var(--mono); }

/* ── Layout ───────────────────────────────────────────────────────────────── */
#app {
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: 380px 1fr;
  grid-template-areas:
    "header header"
    "left   right";
  min-height: 100vh;
  max-width: 1280px;
  margin: 0 auto;
}
@media (max-width: 800px) {
  #app {
    grid-template-columns: 1fr;
    grid-template-areas: "header" "left" "right";
  }
}

/* ── Header ───────────────────────────────────────────────────────────────── */
header {
  grid-area: header;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.logo {
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: -0.02em;
  flex: none;
}
.logo span { color: var(--text-faint); font-weight: 400; }
.header-sep { flex: 1; }
.worker-cfg {
  display: flex;
  align-items: center;
  gap: 8px;
}
.worker-cfg input {
  font-family: var(--mono);
  font-size: 0.8rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  padding: 5px 10px;
  width: 240px;
  outline: none;
}
.worker-cfg input:focus { border-color: var(--accent); }
#connect-btn {
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: var(--r);
  padding: 5px 12px;
  font-size: 0.8rem;
  font-family: var(--mono);
  transition: background 0.15s;
}
#connect-btn:hover { background: var(--accent); color: var(--bg); }
.conn-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--muted);
  flex: none;
}
.conn-dot.ok    { background: var(--ok); }
.conn-dot.error { background: var(--reject); }

/* ── Left column ──────────────────────────────────────────────────────────── */
#left {
  grid-area: left;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.scenario-btns {
  display: flex;
  gap: 10px;
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.run-btn {
  flex: 1;
  padding: 10px 0;
  border-radius: var(--r);
  border: 1px solid;
  font-family: var(--mono);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  transition: background 0.15s, color 0.15s;
}
.run-btn.kc {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}
.run-btn.kc:hover, .run-btn.kc.active {
  background: var(--accent);
  color: var(--bg);
}
.run-btn.rogue {
  background: var(--rogue-dim);
  border-color: var(--rogue);
  color: var(--rogue);
}
.run-btn.rogue:hover, .run-btn.rogue.active {
  background: var(--rogue);
  color: #fff;
}
.run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Outcome banner ───────────────────────────────────────────────────────── */
#outcome {
  padding: 12px 16px;
  font-family: var(--mono);
  font-size: 0.82rem;
  font-weight: 600;
  display: none;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}
#outcome.approved {
  display: flex;
  background: var(--ok-dim);
  color: var(--ok);
  border-bottom-color: var(--ok);
}
#outcome.rejected {
  display: flex;
  background: var(--reject-dim);
  color: var(--reject);
  border-bottom-color: var(--reject);
}

/* ── Step list ────────────────────────────────────────────────────────────── */
#steps {
  flex: 1;
  padding: 8px 0;
  overflow-y: auto;
}
.step-item {
  display: flex;
  align-items: flex-start;
  gap: 0;
  position: relative;
  padding: 0;
  cursor: pointer;
  transition: background 0.1s;
}
.step-item:hover { background: var(--surface2); }
.step-item.active { background: var(--surface2); }

/* connector line */
.step-line {
  position: absolute;
  left: 30px;
  top: 40px;
  width: 2px;
  bottom: 0;
  background: var(--border);
  transition: background 0.4s;
  z-index: 0;
}
.step-item:last-child .step-line { display: none; }
.step-item.status-ok   .step-line { background: var(--ok); }
.step-item.status-reject .step-line { background: var(--reject); }

.step-icon-col {
  width: 60px;
  padding: 14px 0 14px 16px;
  flex: none;
  position: relative;
  z-index: 1;
}
.step-icon {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--muted);
  transition: all 0.3s;
  flex: none;
}
.step-item.status-ok     .step-icon { border-color: var(--ok);     color: var(--ok);     background: var(--ok-dim); }
.step-item.status-reject .step-icon { border-color: var(--reject); color: var(--reject); background: var(--reject-dim); }
.step-item.status-active .step-icon {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.step-body {
  flex: 1;
  padding: 12px 16px 12px 0;
  min-width: 0;
}
.step-name {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.step-detail {
  font-size: 0.72rem;
  color: var(--text-faint);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.step-chip {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 3px;
  margin-top: 4px;
}
.chip-ok     { background: var(--ok-dim);     color: var(--ok);     }
.chip-reject { background: var(--reject-dim); color: var(--reject); }
.chip-active { background: var(--accent-dim); color: var(--accent); }

/* ── Right panel ──────────────────────────────────────────────────────────── */
#right {
  grid-area: right;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 12px;
}
.panel-title {
  font-family: var(--mono);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.panel-sub { font-size: 0.78rem; color: var(--text-faint); flex: 1; }

.panel-tabs {
  display: flex;
  gap: 4px;
}
.tab-btn {
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-faint);
  transition: all 0.15s;
}
.tab-btn:hover { color: var(--text); border-color: var(--muted); }
.tab-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

#detail-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

/* ── Detail card ─────────────────────────────────────────────────────────── */
.detail-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 14px;
  overflow: hidden;
}
.detail-card-hd {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.detail-card-hd .tag {
  font-size: 0.65rem;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--surface2);
  color: var(--accent);
  border: 1px solid var(--accent-dim);
  text-transform: none;
  letter-spacing: 0;
}
.detail-card-body {
  padding: 14px;
}
.jwt-block {
  font-family: var(--mono);
  font-size: 0.72rem;
  background: var(--bg);
  border-radius: 4px;
  padding: 12px;
  overflow-x: auto;
  white-space: pre;
  color: var(--text);
  line-height: 1.6;
}
.jwt-block .key   { color: var(--accent); }
.jwt-block .str   { color: #86EFAC; }
.jwt-block .num   { color: #FCA5A5; }
.jwt-block .bool  { color: var(--rogue); }

/* step detail narrative */
.step-narrative {
  font-size: 0.82rem;
  color: var(--text);
  line-height: 1.6;
  margin-bottom: 14px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
}
.step-narrative.ok     { border-left: 3px solid var(--ok); }
.step-narrative.reject { border-left: 3px solid var(--reject); }

/* KV table */
.kv-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.kv-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.kv-table td:first-child {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--accent);
  white-space: nowrap;
  width: 140px;
}
.kv-table td:last-child { word-break: break-all; color: var(--text); }

/* federation state */
.entity-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.78rem;
}
.entity-row:last-child { border-bottom: none; }
.entity-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  flex: none;
  margin-top: 5px;
}
.entity-id {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--text-faint);
  word-break: break-all;
}
.entity-marks { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.mark-chip {
  font-family: var(--mono);
  font-size: 0.62rem;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid;
  border-color: color-mix(in srgb, var(--accent) 30%, transparent);
}
.mark-chip.rogue { background: var(--rogue-dim); color: var(--rogue); border-color: var(--rogue-dim); }

/* empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-faint);
}
.empty-state .big {
  font-family: var(--mono);
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--border);
  margin-bottom: 12px;
}
.empty-state p { font-size: 0.82rem; line-height: 1.7; }

/* error toast */
#error-toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--reject-dim);
  color: var(--reject);
  border: 1px solid var(--reject);
  border-radius: var(--r);
  padding: 10px 16px;
  font-family: var(--mono);
  font-size: 0.78rem;
  max-width: 400px;
  display: none;
  z-index: 100;
  animation: slideup 0.2s ease;
}
@keyframes slideup { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* focus */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo">WIMSE<span>·demo</span></div>
    <div style="font-size:0.78rem;color:var(--text-faint)">B2B Cross-Cloud Authentication</div>
    <div class="header-sep"></div>
    <div class="worker-cfg">
      <div class="conn-dot" id="conn-dot"></div>
      <input id="worker-url" type="text" spellcheck="false"
             placeholder="http://localhost:8787"
             aria-label="Worker base URL">
      <button id="connect-btn">connect</button>
    </div>
  </header>

  <div id="left">
    <div class="scenario-btns">
      <button class="run-btn kc"    id="btn-kc"    title="Keycloak is in the federation and holds certified-idp trust mark">Run: Keycloak (trusted)</button>
      <button class="run-btn rogue" id="btn-rogue" title="Rogue IdP is not registered in the federation — rejected at step 4">Run: Rogue IdP</button>
    </div>
    <div id="outcome"></div>
    <div id="steps">
      <div class="empty-state">
        <div class="big">—</div>
        <p>Choose a scenario above.<br>Steps appear as the protocol runs.</p>
      </div>
    </div>
  </div>

  <div id="right">
    <div class="panel-header">
      <div class="panel-title" id="panel-title">Select a step</div>
      <div class="panel-sub" id="panel-sub"></div>
      <div class="panel-tabs">
        <button class="tab-btn active" id="tab-detail" onclick="switchTab('detail')">Detail</button>
        <button class="tab-btn"        id="tab-fed"    onclick="switchTab('fed')">Federation</button>
      </div>
    </div>
    <div id="detail-area">
      <div class="empty-state" id="empty-right">
        <div class="big">↑</div>
        <p>Run a scenario to see the<br>WIMSE + OID-FED protocol in action.</p>
      </div>
    </div>
  </div>
</div>

<div id="error-toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const PROD_WORKER = 'https://wimse-demo-worker-production.jralmaraz1.workers.dev';
const params  = new URLSearchParams(location.search);
let WORKER    = params.get('worker') || PROD_WORKER;
let currentTab = 'detail';
let scenarioData = null;
let fedState = null;
let activeStep = null;
let running = false;

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('worker-url').value = WORKER;

document.getElementById('connect-btn').onclick = async () => {
  WORKER = document.getElementById('worker-url').value.trim().replace(/\/$/, '');
  await checkHealth();
};

document.getElementById('worker-url').onkeydown = e => {
  if (e.key === 'Enter') document.getElementById('connect-btn').click();
};

document.getElementById('btn-kc').onclick    = () => runScenario('keycloak');
document.getElementById('btn-rogue').onclick = () => runScenario('rogue');

async function checkHealth() {
  const dot = document.getElementById('conn-dot');
  try {
    const r = await fetch(`${WORKER}/healthz`);
    if (r.ok) {
      dot.className = 'conn-dot ok';
      await loadFedState();
    } else {
      dot.className = 'conn-dot error';
    }
  } catch {
    dot.className = 'conn-dot error';
  }
}

async function loadFedState() {
  try {
    const r = await fetch(`${WORKER}/api/state`);
    fedState = await r.json();
    if (currentTab === 'fed') renderFedPanel();
  } catch {}
}

// ── Run scenario ──────────────────────────────────────────────────────────────
async function runScenario(idp) {
  if (running) return;
  running = true;

  const btnKC    = document.getElementById('btn-kc');
  const btnRogue = document.getElementById('btn-rogue');
  btnKC.disabled    = true;
  btnRogue.disabled = true;
  btnKC.classList.toggle('active',    idp === 'keycloak');
  btnRogue.classList.toggle('active', idp === 'rogue');

  // Reset UI
  document.getElementById('outcome').className = '';
  document.getElementById('outcome').style.display = 'none';
  document.getElementById('steps').innerHTML = '';
  document.getElementById('empty-right').style.display = 'none';
  scenarioData = null;
  activeStep   = null;
  clearDetailArea();

  try {
    const r = await fetch(`${WORKER}/api/scenario/b2b?idp=${idp}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    scenarioData = await r.json();
  } catch (e) {
    showError(`Worker unreachable: ${e.message}. Is it running at ${WORKER}?`);
    running = false;
    btnKC.disabled    = false;
    btnRogue.disabled = false;
    document.getElementById('empty-right').style.display = '';
    return;
  }

  // Animate steps
  for (let i = 0; i < scenarioData.steps.length; i++) {
    const step = scenarioData.steps[i];
    appendStep(step, i, scenarioData.steps.length);
    await delay(180);
    if (step.status === 'rejected') break;
  }

  // Outcome banner
  showOutcome(scenarioData);

  // Auto-select first step
  const first = document.querySelector('.step-item');
  if (first) first.click();

  running = false;
  btnKC.disabled    = false;
  btnRogue.disabled = false;
}

function appendStep(step, idx, total) {
  const el = document.createElement('div');
  el.className = `step-item status-${step.status === 'ok' ? 'ok' : 'reject'}`;
  el.dataset.idx = idx;
  el.innerHTML = `
    <div class="step-icon-col">
      <div class="step-icon">${step.step}</div>
      ${idx < total - 1 ? '<div class="step-line"></div>' : ''}
    </div>
    <div class="step-body">
      <div class="step-name">${escHtml(step.name)}</div>
      <div class="step-detail">${escHtml(step.detail)}</div>
      <span class="step-chip ${step.status === 'ok' ? 'chip-ok' : 'chip-reject'}">${step.status}</span>
    </div>`;
  el.onclick = () => selectStep(idx);
  document.getElementById('steps').appendChild(el);

  // Subtle entrance
  el.style.opacity = '0';
  el.style.transform = 'translateX(-6px)';
  requestAnimationFrame(() => {
    el.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
    el.style.opacity = '1';
    el.style.transform = 'none';
  });
}

function showOutcome(data) {
  const el = document.getElementById('outcome');
  if (data.outcome === 'approved') {
    el.className = 'approved';
    el.innerHTML = `<span style="font-size:1rem">✓</span> Transaction approved — all 9 steps passed`;
  } else {
    el.className = 'rejected';
    el.innerHTML = `<span style="font-size:1rem">✗</span> Rejected at step ${data.rejected_at} — IdP not trusted by federation`;
  }
}

// ── Step selection ────────────────────────────────────────────────────────────
function selectStep(idx) {
  activeStep = idx;
  document.querySelectorAll('.step-item').forEach(el => {
    el.classList.toggle('active', +el.dataset.idx === idx);
  });

  if (currentTab === 'detail') renderDetailPanel(idx);
  else if (currentTab === 'fed') renderFedPanel();
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-detail').classList.toggle('active', tab === 'detail');
  document.getElementById('tab-fed').classList.toggle('active',    tab === 'fed');

  if (tab === 'detail' && activeStep !== null) renderDetailPanel(activeStep);
  else if (tab === 'detail') clearDetailArea();
  else renderFedPanel();
}

// ── Detail panel ──────────────────────────────────────────────────────────────
function renderDetailPanel(idx) {
  if (!scenarioData) return;
  const step = scenarioData.steps[idx];
  document.getElementById('panel-title').textContent = `Step ${step.step}`;
  document.getElementById('panel-sub').textContent    = step.name;

  const area = document.getElementById('detail-area');
  area.innerHTML = '';

  // Narrative card
  const narr = document.createElement('div');
  narr.className = `step-narrative ${step.status}`;
  narr.textContent = step.detail;
  area.appendChild(narr);

  if (step.data && Object.keys(step.data).length) {
    const card = makeCard('Protocol data', typ(step));
    const table = document.createElement('table');
    table.className = 'kv-table';
    for (const [k, v] of Object.entries(step.data)) {
      const tr = document.createElement('tr');
      const val = typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v);
      tr.innerHTML = `<td>${escHtml(k)}</td><td>${escHtml(val)}</td>`;
      table.appendChild(tr);
    }
    card.querySelector('.detail-card-body').appendChild(table);
    area.appendChild(card);
  }

  // Show JWT structures for token-issuing steps
  addJWTExamples(step, area);
}

function addJWTExamples(step, area) {
  const stepNum = step.step;
  const examples = {
    1: [
      { label: 'WIT header', tag: 'wit+jwt', obj: { alg: 'ES256', typ: 'wit+jwt', kid: 'kc-prot-1' } },
      { label: 'WIT payload', tag: 'wit+jwt', obj: { iss: '…/idp/keycloak', sub: 'spiffe://finclear.io/workload/…', aud: ['…/as'], cnf: { jwk: { kty: 'EC', crv: 'P-256', use: 'sig' } } } },
    ],
    2: [
      { label: 'WAG header', tag: 'wag+jwt', obj: { alg: 'ES256', typ: 'wag+jwt', kid: 'spire-1' } },
      { label: 'WAG payload', tag: 'wag+jwt', obj: { iss: '…/spire', sub: 'spiffe://finclear.io/workload/…', scope: 'fraud:read compliance:write partner:verify', wit_iss: '…/idp/keycloak' } },
    ],
    5: [
      { label: 'Access Token header', tag: 'at+jwt', obj: { alg: 'ES256', typ: 'at+jwt', kid: 'as-1' } },
      { label: 'Access Token payload', tag: 'at+jwt', obj: { iss: '…/as', sub: 'spiffe://finclear.io/workload/…', cnf: { jwk: { kty: 'EC', crv: 'P-256', use: 'sig' } }, scope: 'fraud:read compliance:write partner:verify' } },
    ],
    8: [
      { label: 'resolve-response', tag: 'resolve-response+jwt', obj: { iss: '…/ta', sub: '…/idp/keycloak', trust_anchor: '…/ta', trust_chain: ['[EC JWT]', '[SubStmt JWT]', '[TA EC JWT]'], metadata: { openid_provider: { issuer: '…/idp/keycloak', jwks_uri: '…/idp/keycloak/protocol/openid-connect/certs' } } } },
    ],
  };

  if (!examples[stepNum]) return;
  for (const ex of examples[stepNum]) {
    const card = makeCard(ex.label, ex.tag);
    const pre = document.createElement('div');
    pre.className = 'jwt-block';
    pre.innerHTML = syntaxHighlight(ex.obj);
    card.querySelector('.detail-card-body').appendChild(pre);
    area.appendChild(card);
  }
}

function makeCard(label, tag) {
  const card = document.createElement('div');
  card.className = 'detail-card';
  card.innerHTML = `
    <div class="detail-card-hd">
      ${escHtml(label)}
      ${tag ? `<span class="tag">${escHtml(tag)}</span>` : ''}
    </div>
    <div class="detail-card-body"></div>`;
  return card;
}

function typ(step) {
  const map = { 1: 'wit+jwt', 2: 'wag+jwt', 5: 'at+jwt', 6: 'application/wpt+jwt', 7: 'application/wpt+jwt', 8: 'resolve-response+jwt' };
  return map[step.step] || '';
}

// ── Federation panel ──────────────────────────────────────────────────────────
function renderFedPanel() {
  document.getElementById('panel-title').textContent = 'Federation';
  document.getElementById('panel-sub').textContent   = 'Trust anchor · Entities · Trust marks';

  const area = document.getElementById('detail-area');
  area.innerHTML = '';

  if (!fedState) {
    area.innerHTML = '<div class="empty-state"><div class="big">—</div><p>Connect to the Worker to load federation state.</p></div>';
    return;
  }

  // Trust anchor
  const taCard = makeCard('Trust Anchor', 'federation_entity');
  const taBody = taCard.querySelector('.detail-card-body');
  taBody.innerHTML = `<div class="entity-id">${escHtml(fedState.federation.trust_anchor.id)}</div>`;
  area.appendChild(taCard);

  // IdPs
  const idpCard = makeCard('Registered IdPs', 'openid_provider');
  const idpBody = idpCard.querySelector('.detail-card-body');
  const registry = fedState.trust_marks;

  for (const idp of fedState.federation.idps) {
    const marks = Object.entries(registry)
      .filter(([, holders]) => holders.includes(idp.id))
      .map(([id]) => id.split('/').pop());

    const row = document.createElement('div');
    row.className = 'entity-row';
    row.innerHTML = `
      <div class="entity-dot"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;margin-bottom:2px">${escHtml(idp.name)}</div>
        <div class="entity-id">${escHtml(idp.id)}</div>
        <div class="entity-marks">
          ${marks.map(m => `<span class="mark-chip">${escHtml(m)}</span>`).join('')}
        </div>
      </div>`;
    idpBody.appendChild(row);
  }

  // Rogue IdP (not in federation)
  const rogueRow = document.createElement('div');
  rogueRow.className = 'entity-row';
  rogueRow.innerHTML = `
    <div class="entity-dot" style="background:var(--reject)"></div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;margin-bottom:2px;color:var(--reject)">Rogue Bank (not registered)</div>
      <div class="entity-id">${escHtml(fedState.federation.trust_anchor.id.replace('/ta', '/idp/rogue-bank'))}</div>
      <div class="entity-marks"><span class="mark-chip rogue">no trust marks</span></div>
    </div>`;
  idpBody.appendChild(rogueRow);
  area.appendChild(idpCard);

  // RP
  const rpCard = makeCard('Relying Party', 'openid_relying_party');
  rpCard.querySelector('.detail-card-body').innerHTML = `
    <div class="entity-row" style="border:none;padding-top:0">
      <div class="entity-dot" style="background:var(--ok)"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;margin-bottom:2px">${escHtml(fedState.federation.rp.name)}</div>
        <div class="entity-id">${escHtml(fedState.federation.rp.id)}</div>
        <div class="entity-marks"><span class="mark-chip" style="background:var(--ok-dim);color:var(--ok)">verified-rp</span></div>
      </div>
    </div>`;
  area.appendChild(rpCard);

  // WIMSE identifiers
  const wimCard = makeCard('WIMSE Identifiers', '');
  const table = document.createElement('table');
  table.className = 'kv-table';
  const rows = [
    ['SPIRE issuer',  fedState.wimse.spire_issuer],
    ['AS issuer',     fedState.wimse.as_issuer],
    ['Workload',      fedState.wimse.workload_spiffe],
    ['Active IdP',    fedState.wimse.idp_entity_id],
  ];
  for (const [k, v] of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${escHtml(k)}</td><td>${escHtml(v)}</td>`;
    table.appendChild(tr);
  }
  wimCard.querySelector('.detail-card-body').appendChild(table);
  area.appendChild(wimCard);
}

function clearDetailArea() {
  document.getElementById('panel-title').textContent = 'Select a step';
  document.getElementById('panel-sub').textContent   = '';
  document.getElementById('detail-area').innerHTML   = '<div class="empty-state" id="empty-right"><div class="big">↑</div><p>Run a scenario to see the<br>WIMSE + OID-FED protocol in action.</p></div>';
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function syntaxHighlight(obj) {
  const json = JSON.stringify(obj, null, 2);
  return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
    if (/^"/.test(match)) {
      if (/:$/.test(match)) return `<span class="key">${escHtml(match)}</span>`;
      return `<span class="str">${escHtml(match)}</span>`;
    }
    if (/true|false/.test(match)) return `<span class="bool">${escHtml(match)}</span>`;
    return `<span class="num">${escHtml(match)}</span>`;
  });
}

function showError(msg) {
  const el = document.getElementById('error-toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
checkHealth();
</script>
